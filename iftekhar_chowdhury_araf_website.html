<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal profile of Iftekhar Chowdhury Araf.">
  <title>Iftekhar Chowdhury Araf | Personal Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #17243b;
      --muted: #718096;
      --blue: #2878f0;
      --line: #e8eef7;
      --bg: #f3f7fd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 34px 16px;
      display: grid; place-items: center;
      background: radial-gradient(circle at 12% 8%, #e4efff 0, transparent 32%),
                  radial-gradient(circle at 90% 90%, #e8f8f5 0, transparent 28%), var(--bg);
      color: var(--ink); font-family: 'Poppins', sans-serif;
    }
    .profile-card {
      width: min(100%, 560px); background: rgba(255,255,255,.96);
      border: 1px solid rgba(220,230,244,.9); border-radius: 28px;
      padding: 34px 30px 30px; text-align: center;
      box-shadow: 0 22px 65px rgba(36, 67, 112, .12);
    }
    .portrait-wrap {
      width: 174px; height: 174px; margin: 0 auto 20px; padding: 5px;
      border-radius: 50%; background: linear-gradient(140deg, #3987ff, #72d6c2);
      box-shadow: 0 9px 24px rgba(40,120,240,.2);
    }
    .portrait { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: center 28%; border: 4px solid white; }
    h1 { margin: 0; font-size: clamp(23px, 5vw, 30px); line-height: 1.35; font-weight: 800; letter-spacing: -.8px; }
    .verified { display: inline-flex; vertical-align: 3px; margin-left: 5px; width: 21px; height: 21px; }
    .subtitle { margin: 8px 0 27px; color: var(--muted); font-size: 13px; font-weight: 500; letter-spacing: .4px; }
    .details { text-align: left; border-top: 1px solid var(--line); padding-top: 23px; }
    h2 { margin: 0 0 17px; text-align: left; font-size: 21px; font-weight: 800; letter-spacing: -.4px; }
    .detail-row {
      display: flex; align-items: center; gap: 15px; padding: 15px 14px;
      margin: 10px 0; border: 1px solid #edf1f7; border-radius: 16px;
      background: #fff; transition: transform .18s ease, box-shadow .18s ease;
    }
    .detail-row:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(37,65,105,.07); }
    .icon-box { flex: 0 0 44px; width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; }
    .icon-box svg { width: 23px; height: 23px; }
    .education { background: #e9f8f1; color: #16a36a; }
    .whatsapp { background: #e7f9ee; color: #20b968; }
    .email { background: #fff1e8; color: #f07a36; }
    .relationship { background: #f1edff; color: #8064df; }
    .detail-copy { min-width: 0; }
    .label { display: block; color: #8290a4; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
    .value { display: block; color: #263650; font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
    a { color: inherit; text-decoration: none; }
    .footer { margin: 22px 0 0; color: #9aa6b7; font-size: 11px; }
    @media (max-width: 420px) {
      body { padding: 18px 12px; } .profile-card { padding: 27px 17px 23px; border-radius: 23px; }
      .portrait-wrap { width: 150px; height: 150px; } .detail-row { padding: 12px 10px; gap: 12px; }
      .value { font-size: 13px; }
    }
  </style>
